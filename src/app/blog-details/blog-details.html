<div class="post-details-container" style="max-width: 800px; margin: 20px auto; padding: 15px;">
  
  @if (post()) {
    <article>
     
      <a routerLink="/" class="btn-back" style="display: inline-block; margin-bottom: 20px; text-decoration: none; color: #007bff;">← العودة للرئيسية</a>

      <img [src]="post().image" [alt]="post().title" style="width: 100%; max-height: 400px; object-fit: cover; border-radius: 12px; margin-bottom: 20px;">

      <h1>{{ post().title }}</h1>
      
      
      <div class="author-box" style="display: flex; align-items: center; gap: 15px; margin: 20px 0; padding: 10px; background: #f9f9f9; border-radius: 8px;">
        <img [src]="post().author.avatar" [alt]="post().author.name" style="width: 50px; height: 50px; border-radius: 50%;">
        <div>
          <strong>{{ post().author.name }}</strong> <br>
          <small>{{ post().author.role }} | {{ post().date }}</small>
        </div>
      </div>

      
      <div class="post-content" style="line-height: 1.8; font-size: 1.1rem; white-space: pre-line;">
        {{ post().content }}
      </div>
    </article>
  } @else {
    <p>Loading.....</p>
  }

</div>
